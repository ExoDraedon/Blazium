<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Tetris Simple</title>
  <style>
    body {
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: monospace;
    }
    canvas {
      border: 2px solid #39ff14;
      background-color: #111;
    }
    h1 {
      color: #39ff14;
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>
  <h1>TETRIS</h1>
  <canvas id="tetris" width="240" height="400"></canvas>
  <script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    context.scale(20, 20);

    function crearMatriz(w, h) {
      const matriz = [];
      while (h--) {
        matriz.push(new Array(w).fill(0));
      }
      return matriz;
    }

    function dibujarMatriz(matriz, offset) {
      matriz.forEach((fila, y) => {
        fila.forEach((valor, x) => {
          if (valor !== 0) {
            context.fillStyle = 'cyan';
            context.fillRect(x + offset.x, y + offset.y, 1, 1);
          }
        });
      });
    }

    function colision(arena, jugador) {
      const m = jugador.matriz;
      const o = jugador.posicion;
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
              (arena[y + o.y] &&
               arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function fusionar(arena, jugador) {
      jugador.matriz.forEach((fila, y) => {
        fila.forEach((valor, x) => {
          if (valor !== 0) {
            arena[y + jugador.posicion.y][x + jugador.posicion.x] = valor;
          }
        });
      });
    }

    function borrarFilas() {
      let filasBorradas = 0;
      outer: for (let y = arena.length - 1; y >= 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) {
            continue outer;
          }
        }
        const fila = arena.splice(y, 1)[0].fill(0);
        arena.unshift(fila);
        ++filasBorradas;
        y++;
      }
      return filasBorradas;
    }

    function rotar(matriz, dir) {
      for (let y = 0; y < matriz.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matriz[x][y], matriz[y][x]] = [matriz[y][x], matriz[x][y]];
        }
      }
      if (dir > 0) {
        matriz.forEach(fila => fila.reverse());
      } else {
        matriz.reverse();
      }
    }

    function jugadorRotar(dir) {
      const pos = jugador.posicion.x;
      let offset = 1;
      rotar(jugador.matriz, dir);
      while (colision(arena, jugador)) {
        jugador.posicion.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > jugador.matriz[0].length) {
          rotar(jugador.matriz, -dir);
          jugador.posicion.x = pos;
          return;
        }
      }
    }

    const jugador = {
      posicion: {x: 0, y: 0},
      matriz: [
        [0, 1, 0],
        [0, 1, 0],
        [0, 1, 1]
      ]
    };

    const arena = crearMatriz(12, 20);

    function actualizar() {
      jugador.posicion.y++;
      if (colision(arena, jugador)) {
        jugador.posicion.y--;
        fusionar(arena, jugador);
        borrarFilas();
        jugador.posicion.y = 0;
        jugador.matriz = [
          [0, 1, 0],
          [0, 1, 0],
          [0, 1, 1]
        ];
        if (colision(arena, jugador)) {
          alert("Perdiste");
          arena.forEach(fila => fila.fill(0));
        }
      }
    }

    function dibujar() {
      context.fillStyle = '#000';
      context.fillRect(0, 0, canvas.width, canvas.height);
      dibujarMatriz(arena, {x:0, y:0});
      dibujarMatriz(jugador.matriz, jugador.posicion);
    }

    document.addEventListener('keydown', evento => {
      if (evento.key === 'ArrowLeft') {
        jugador.posicion.x--;
        if (colision(arena, jugador)) {
          jugador.posicion.x++;
        }
      } else if (evento.key === 'ArrowRight') {
        jugador.posicion.x++;
        if (colision(arena, jugador)) {
          jugador.posicion.x--;
        }
      } else if (evento.key === 'ArrowDown') {
        actualizar();
        dibujar();
      } else if (evento.key === 'q') {
        jugadorRotar(-1);
      } else if (evento.key === 'w') {
        jugadorRotar(1);
      }
    });

    setInterval(() => {
      actualizar();
      dibujar();
    }, 500);
  </script>
</body>
</html>
