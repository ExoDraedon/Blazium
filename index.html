<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Elige tu destino</title>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    h1 {
      font-size: 2em;
      opacity: 0;
      transform: translateY(40px);
      animation: subir 1s ease-out forwards;
    }

    input {
      margin-top: 30px;
      padding: 10px;
      font-size: 1.2em;
      background-color: black;
      color: white;
      border: 2px solid white;
      outline: none;
      opacity: 0;
      animation: aparecer 1s ease-out forwards;
      animation-delay: 1s;
    }

    @keyframes subir {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes aparecer {
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <h1>Elige el destino</h1>
  <input type="text" id="codigo" placeholder="Escribe el código">

  <script>
    document.getElementById('codigo').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const valor = this.value.trim().toLowerCase();

        // Agrega aquí los códigos válidos
        if (valor === "nameless") {
          window.location.href = "https://www.mediafire.com/view/example"; // Cambia por tu enlace real
        } else {
          alert("Ese destino no existe...");
        }
      }
    });
  </script>

</body>
</html>
