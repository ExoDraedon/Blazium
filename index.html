<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>BLAZIUM CODE BREAKER</title>

  <style>
    @font-face {
      font-family: 'DeltaruneFont';
      src: url('deltarune.ttf') format('truetype');
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: black;
      font-family: 'DeltaruneFont', monospace;
      color: white;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
      z-index: 0;
    }

    #bgVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
      opacity: 0;
      transition: opacity 2s ease-in;
      pointer-events: none;
    }

    /* Contenedor principal */
    .container {
      display: none; /* oculto al inicio */
      flex-direction: column;
      align-items: center;
      gap: 30px;
      text-align: center;
      padding: 20px;
      z-index: 1;
      width: 320px;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 1s ease-out, transform 1s ease-out;
    }

    /* Contenedor de acceso */
    #loginScreen {
      display: flex; /* visible al inicio */
      flex-direction: column;
      align-items: center;
      gap: 25px;
      text-align: center;
      padding: 20px;
      z-index: 2;
      background-color: rgba(0,0,0,0.8);
      border-radius: 10px;
      width: 320px;
      box-shadow: 0 0 15px white;
      opacity: 0;
      transform: translateY(40px);
      animation: subir 1s ease-out forwards;
    }

    h1, #loginScreen h2 {
      margin: 0;
      user-select: none;
    }

    h1 {
      font-size: 2.5em;
    }

    #loginScreen h2 {
      font-size: 1.8em;
      color: #ccc;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      font-size: 1.3em;
      background-color: rgba(0, 0, 0, 0.6);
      color: white;
      border: 2px solid white;
      border-radius: 5px;
      outline: none;
      font-family: 'DeltaruneFont', monospace;
    }

    input::placeholder {
      color: #ccc;
    }

    @keyframes subir {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <video autoplay muted loop id="bgVideo" playsinline>
    <source src="vid.mp4" type="video/mp4" />
    Tu navegador no soporta video.
  </video>

  <!-- Pantalla de login -->
  <div id="loginScreen">
    <h2>Ingresa la clave</h2>
    <input type="password" id="loginInput" placeholder="Clave secreta" autocomplete="off" />
  </div>

  <!-- Contenido principal (oculto al inicio) -->
  <div class="container" id="mainContent">
    <h1>BLAZIUM CODE BREAKER</h1>
    <input type="text" id="codigo" placeholder="INGRESA EL CODIGO" autocomplete="off" />
  </div>

  <script>
    const loginScreen = document.getElementById('loginScreen');
    const mainContent = document.getElementById('mainContent');
    const loginInput = document.getElementById('loginInput');
    const codigoInput = document.getElementById('codigo');
    const bgVideo = document.getElementById('bgVideo');

    loginInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const clave = this.value.trim();

        if (clave === 'abracadabra') {  // Cambia aquí tu clave secreta
          // Animación de salida para login
          loginScreen.style.transition = 'opacity 1s ease-out, transform 1s ease-out';
          loginScreen.style.opacity = 0;
          loginScreen.style.transform = 'translateY(-40px)';

          // Mostrar y hacer fade-in al video de fondo
          setTimeout(() => {
            loginScreen.style.display = 'none';
            bgVideo.style.opacity = 1;
          }, 1000);

          // Mostrar el contenido principal después de 2 segundos del video visible
          setTimeout(() => {
            mainContent.style.display = 'flex';
            // Trigger animación entrada
            requestAnimationFrame(() => {
              mainContent.style.opacity = 1;
              mainContent.style.transform = 'translateY(0)';
              codigoInput.focus();
            });
          }, 3000);

        } else {
          alert('Clave incorrecta');
          this.value = '';
        }
      }
    });

    // Lógica para el código dentro del codebreaker
    codigoInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const valor = this.value.trim().toLowerCase();

        if (valor === "hola") {
          window.location.href = "https://deltarune.com"; // Cambia por tu enlace real
        } else {
          alert("Ese destino no existe...");
        }
      }
    });
  </script>

</body>
</html>
