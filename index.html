<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>BLAZIUM CODE BREAKER</title>

  <style>
    /* Cargar la fuente local */
    @font-face {
      font-family: 'DeltaruneFont';
      src: url('deltarune.ttf') format('truetype');
    }

    body {
      margin: 0;
      background-color: black;
      color: white;
      font-family: 'DeltaruneFont', monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
      z-index: 0;
    }

    /* Video de fondo */
    #bgVideo {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100vw;
      min-height: 100vh;
      object-fit: cover;
      z-index: -1;
    }

    h1 {
      font-size: 2em;
      opacity: 0;
      transform: translateY(40px);
      animation: subir 1s ease-out forwards;
      z-index: 1;
      user-select: none;
    }

    input {
      margin-top: 30px;
      padding: 10px;
      font-size: 1.2em;
      background-color: rgba(0, 0, 0, 0.6);
      color: white;
      border: 2px solid white;
      outline: none;
      opacity: 0;
      animation: aparecer 1s ease-out forwards;
      animation-delay: 1s;
      font-family: 'DeltaruneFont', monospace;
      border-radius: 5px;
      z-index: 1;
    }

    @keyframes subir {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes aparecer {
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <!-- Video de fondo -->
  <video autoplay muted loop id="bgVideo" playsinline>
    <source src="vid.mp4" type="video/mp4" />
    Tu navegador no soporta video.
  </video>

  <h1>BLAZIUM CODE BREAKER</h1>
  <input type="text" id="codigo" placeholder="INGRESA EL CODIGO" autocomplete="off" />

  <script>
    document.getElementById('codigo').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const valor = this.value.trim().toLowerCase();

        // Agrega aquí los códigos válidos
        if (valor === "hola") {
          window.location.href = "https://deltarune.com"; // Cambia por tu enlace real
        } else {
          alert("Ese destino no existe...");
        }
      }
    });
  </script>

</body>
</html>
