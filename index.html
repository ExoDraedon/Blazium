<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>BLAZIUM CODE BREAKER</title>
  <style>
    @font-face {
      font-family: 'DeltaruneFont';
      src: url('deltarune.ttf') format('truetype');
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      background-color: black;
      font-family: 'DeltaruneFont', monospace;
      color: white;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video.bgVideo {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
      opacity: 0;
      transition: opacity 1s ease, filter 1s ease;
    }
    .bgVideo.mostrar {
      display: block;
    }
    @keyframes fondoFadeIn {
      0% { opacity: 0; filter: brightness(0.3) blur(20px); transform: scale(1.1); }
      100% { opacity: 1; filter: brightness(1) blur(0); transform: scale(1); }
    }
    @keyframes subir {
      to { transform: translateY(0); opacity: 1; }
    }
    .container, #loginScreen {
      flex-direction: column;
      align-items: center;
      padding: 20px;
      width: 320px;
      text-align: center;
    }
    .container {
      display: none;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 1s ease-out, transform 1s ease-out;
      gap: 30px;
    }
    #loginScreen {
      display: flex;
      gap: 25px;
      background-color: rgba(0,0,0,0.8);
      box-shadow: 0 0 0px white;
      animation: subir 1s ease-out forwards;
      opacity: 0;
      transform: translateY(40px);
    }
    h1, h2 { margin: 0; user-select: none; }
    h1 { font-size: 2.5em; }
    h2 { font-size: 1.8em; color: #ccc; }
    input {
      width: 100%;
      padding: 12px 15px;
      font-size: 1.3em;
      background-color: rgba(0,0,0,0.6);
      color: white;
      border-radius: 5px;
      border: none;
      font-family: 'DeltaruneFont', monospace;
      outline: none;
    }
    input::placeholder { color: #ccc; }
    .numeros-container {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 12px;
      user-select: none;
    }
    .numero {
      opacity: 0;
      transform: translateY(10px);
      animation-fill-mode: forwards;
      font-size: 1.2em;
      font-weight: bold;
      color: #39ff14;
    }
    .sumas {
      margin-top: 5px;
      font-size: 0.9em;
      line-height: 1.3em;
      white-space: pre-line;
      color: #ddd;
    }
    .visible { opacity: 1 !important; }
    #easterEggGif, #imagenLunark {
      display: none;
      position: fixed;
      z-index: 9999;
    }
    #easterEggGif {
      bottom: 10px;
      right: 10px;
      width: 150px;
      border: 2px solid #39ff14;
      border-radius: 8px;
      box-shadow: 0 0 10px #39ff14;
    }
    #imagenLunark {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 450px;
      opacity: 1;
      transition: opacity 10s ease;
    }
    #imagenLunark.fade { opacity: 0; }
  </style>
</head>
<body>
  <img id="imagenLunark" src="lunark.png" alt="Lunark">
  <video autoplay muted loop id="bgVideo1" class="bgVideo"><source src="vid.mp4" type="video/mp4"></video>
  <video autoplay muted loop id="bgVideo2" class="bgVideo"><source src="balatro.mp4" type="video/mp4"></video>

  <div id="loginScreen">
    <h2>Ingresa la clave</h2>
    <input type="password" id="loginInput" placeholder="Clave secreta" autocomplete="off">
  </div>

  <div class="container" id="mainContent">
    <h1>BLAZIUM CODE BREAKER</h1>
    <input type="text" id="codigo" placeholder="INGRESA EL CODIGO" autocomplete="off">
    <div id="animacionNumeros"></div>
    <div id="mensajeChipaalex" class="mensaje"></div>
    <div id="mensajeCr3stianMC" class="mensaje"></div>
  </div>

  <img id="easterEggGif" src="easter-egg.gif" alt="Easter Egg">
  <audio id="bgMusicInitial" src="back1.mp3" autoplay loop></audio>
  <audio id="bgMusicMain" src="breaker.mp3" loop></audio>

  <script>
    const $ = id => document.getElementById(id);
    const loginScreen = $('loginScreen');
    const mainContent = $('mainContent');
    const loginInput = $('loginInput');
    const codigoInput = $('codigo');
    const animacionNumeros = $('animacionNumeros');
    const easterEggGif = $('easterEggGif');
    const mensajeChipaalex = $('mensajeChipaalex');
    const mensajeCr3stianMC = $('mensajeCr3stianMC');
    const imagenLunark = $('imagenLunark');
    const bgVideo1 = $('bgVideo1');
    const bgVideo2 = $('bgVideo2');
    const bgMusicInitial = $('bgMusicInitial');
    const bgMusicMain = $('bgMusicMain');

    const redirecciones = {
      "tenna": "https://deltarune.com",
      "sir": "https://tusitio.com/sir.png",
      "lalalalalala": "https://mediafire.com/file/oo8zq1z9q4g0qvm/historianeock_1.wav",
      "exo": "https://tusitio.com/exo.png",
      "nameless": "https://tusitio.com/nameless.png",
      "2025": "https://tusitio.com/2025.png",
      "estonoesuncodigo": "https://tusitio.com/estonoesuncodigo.png",
      "weird": "https://deltarune.com",
      "chafasafio6en2025": "https://tusitio.com/chafa.png",
      "exomech": "https://deltarune.com",
      "ralsei": "https://deltarune.com",
      "quiz": "https://deltarune.com",
      "neo": "https://deltarune.com",
      "tvtime!!!!": "https://tusitio.com/tvtime.png",
      "hardmode": "https://tusitio.com/hardmode.png",
      "plantera": "https://tusitio.com/plantera.png",
      "revill": "https://tusitio.com/revill.png"
    };

    loginInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        if (loginInput.value.trim() === 'blazium') {
          loginScreen.style.transition = 'opacity 1s ease-out, transform 1s ease-out';
          loginScreen.style.opacity = 0;
          loginScreen.style.transform = 'translateY(-40px)';

          bgMusicInitial.pause();
          bgMusicInitial.currentTime = 0;
          bgMusicMain.volume = 0;
          bgMusicMain.play();
          let vol = 0;
          const fade = setInterval(() => {
            if ((vol += 0.05) <= 1) bgMusicMain.volume = vol;
            else clearInterval(fade);
          }, 50);

          bgVideo1.classList.add('mostrar');
          void bgVideo1.offsetWidth;
          bgVideo1.style.animation = 'fondoFadeIn 1.5s ease-out forwards';
          bgVideo1.style.opacity = 1;

          setTimeout(() => loginScreen.style.display = 'none', 1000);
          setTimeout(() => {
            mainContent.style.display = 'flex';
            requestAnimationFrame(() => {
              mainContent.style.opacity = 1;
              mainContent.style.transform = 'translateY(0)';
              codigoInput.focus();
            });
          }, 3000);
        } else {
          alert('Clave incorrecta');
          loginInput.value = '';
        }
      }
    });

    codigoInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const val = codigoInput.value.trim().toLowerCase();
        if (["1/7/2025", "01/07/2025", "1-7-2025", "01-07-2025"].includes(val)) animarNumeros();
        else if (val === "1221") mostrarEasterEggGif();
        else if (val === "balatro") cambiarFondo(bgVideo2, bgVideo1);
        else if (val === "delta") cambiarFondo(bgVideo1, bgVideo2);
        else if (val === "chipaalex") mostrarMensaje(mensajeChipaalex, "chipaalex Este bro es la cabra");
        else if (val === "cr3stianmc") mostrarMensaje(mensajeCr3stianMC, "Cr3stianMC Tha goat - El protagonista");
        else if (val === "lunark") mostrarLunark();
        else if (redirecciones[val]) window.location.href = redirecciones[val];
        else alert("Ese destino no existe...");
        codigoInput.value = '';
      }
    });

    function cambiarFondo(show, hide) {
      hide.style.opacity = 0;
      show.classList.add('mostrar');
      void show.offsetWidth;
      show.style.animation = 'fondoFadeIn 1.5s ease-out forwards';
      show.style.opacity = 1;
    }

    function mostrarMensaje(elemento, mensaje) {
      mensajeChipaalex.classList.remove('visible');
      mensajeCr3stianMC.classList.remove('visible');
      elemento.textContent = mensaje;
      elemento.classList.add('visible');
      setTimeout(() => elemento.classList.remove('visible'), 5000);
    }

    function mostrarLunark() {
      imagenLunark.style.display = 'block';
      imagenLunark.classList.remove('fade');
      void imagenLunark.offsetWidth;
      imagenLunark.classList.add('fade');
      setTimeout(() => {
        imagenLunark.style.display = 'none';
        imagenLunark.classList.remove('fade');
      }, 1000);
    }

    function mostrarEasterEggGif() {
      easterEggGif.style.display = 'block';
      setTimeout(() => easterEggGif.style.display = 'none', 5000);
    }

    function animarNumeros() {
      animacionNumeros.innerHTML = '';
      const numeros = ['1','7','2','0','2','5'];
      const container = document.createElement('div');
      container.classList.add('numeros-container');
      animacionNumeros.appendChild(container);
      numeros.forEach((n, i) => setTimeout(() => {
        const span = document.createElement('span');
        span.textContent = n;
        span.className = 'numero';
        span.style.animation = 'subir 0.5s ease forwards';
        container.appendChild(span);
        if (i === numeros.length - 1) setTimeout(mostrarSumas, 700);
      }, i * 400));
    }

    function mostrarSumas() {
      const texto = `Suma 1: 100 + 100 = 200\nSuma 2: 150 + 50 = 200\nSuma 3: 250 - 50 = 200\nSuma 4: 400 - 200 = 200\nSuma 5: 50 + 150 = 200`;
      const div = document.createElement('div');
      div.className = 'sumas';
      div.textContent = texto;
      animacionNumeros.appendChild(div);
    }
  </script>
</body>
</html>
