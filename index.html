<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>BLAZIUM CODE BREAKER</title>
    <style>
      /* Variables de colores y transición */
      :root {
        --bg-color: black;
        --text-color: white;
        --highlight-color: #39ff14;
        --secondary-color: #ccc;
        --opacity-initial: 0;
        --opacity-final: 1;
        --transition-speed: 1s;
        --animation-duration: 3s;
      }

      @font-face {
        font-family: 'DeltaruneFont';
        src: url('deltarune.ttf') format('truetype');
      }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: var(--bg-color);
        font-family: 'DeltaruneFont', monospace;
        color: var(--text-color);
        overflow: hidden;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        position: relative;
        z-index: 0;
      }

      video.bgVideo {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -1;
        opacity: var(--opacity-initial);
        pointer-events: none;
        transition: opacity var(--transition-speed) ease, filter var(--transition-speed) ease;
      }

      #fondo {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: none;
        background-size: cover;
        background-position: center;
        opacity: var(--opacity-initial);
        z-index: -1;
        transition: background var(--transition-speed), opacity var(--transition-speed);
      }

      .container {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 30px;
        text-align: center;
        padding: 20px;
        z-index: 1;
        width: 320px;
        opacity: var(--opacity-initial);
        transform: translateY(40px);
        transition: opacity var(--transition-speed), transform var(--transition-speed);
        position: relative;
      }

      #loginScreen {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 25px;
        text-align: center;
        padding: 20px;
        z-index: 2;
        background-color: rgba(0, 0, 0, 0.8);
        border-radius: 10px;
        width: 320px;
        box-shadow: 0 0 15px white;
        opacity: var(--opacity-initial);
        transform: translateY(40px);
        animation: subir var(--transition-speed) ease-out forwards;
      }

      h1, #loginScreen h2 {
        margin: 0;
        user-select: none;
      }

      h1 {
        font-size: 2.5em;
        position: relative;
      }

      #loginScreen h2 {
        font-size: 1.8em;
        color: var(--secondary-color);
      }

      input {
        width: 100%;
        padding: 12px 15px;
        font-size: 1.3em;
        background-color: rgba(0, 0, 0, 0.6);
        color: var(--text-color);
        border-radius: 5px;
        outline: none;
        font-family: 'DeltaruneFont', monospace;
      }

      input::placeholder {
        color: var(--secondary-color);
      }

      @keyframes subir {
        to {
          transform: translateY(0);
          opacity: var(--opacity-final);
        }
      }

      .numeros-container {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-bottom: 12px;
        user-select: none;
      }

      .numero {
        opacity: 0;
        transform: translateY(10px);
        animation: subir 0.5s ease forwards;
        font-size: 1.2em;
        font-weight: bold;
        color: var(--highlight-color);
      }

      .sumas {
        margin-top: 5px;
        font-size: 0.9em;
        line-height: 1.3em;
        white-space: pre-line;
        color: var(--secondary-color);
        max-width: 320px;
        text-align: center;
      }

      #animacionNumeros {
        position: absolute;
        top: -120px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        width: 320px;
        pointer-events: none;
        user-select: none;
        z-index: 10;
      }

      #easterEggGif, #imagenLunark, #imagenFem {
        display: none;
        transition: opacity var(--transition-speed) ease;
      }

      #imagenLunark.fade {
        opacity: var(--opacity-initial);
      }

      #easterEggGif {
        position: fixed;
        bottom: 10px;
        right: 10px;
        width: 150px;
        border: 2px solid var(--highlight-color);
        border-radius: 8px;
        box-shadow: 0 0 10px var(--highlight-color);
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <img id="imagenFem" src="imagenes/fem.png" alt="Fem" />
    <div id="fondo"></div>
    <img id="imagenLunark" src="imagenes/lunark.png" alt="Lunark" />
    <video autoplay muted loop id="bgVideo1" class="bgVideo" playsinline>
      <source src="fondos/vid.mp4" type="video/mp4" />
    </video>
    <video autoplay muted loop id="bgVideo2" class="bgVideo" playsinline>
      <source src="fondos/balatro.mp4" type="video/mp4" />
    </video>
    <div id="loginScreen">
      <h2>Ingresa la clave</h2>
      <input type="password" id="loginInput" placeholder="Clave secreta" autocomplete="off" />
    </div>
    <div class="container" id="mainContent">
      <h1>BLAZIUM CODE BREAKER</h1>
      <input type="text" id="codigo" placeholder="INGRESA EL CODIGO" autocomplete="off" />
      <div id="animacionNumeros"></div>
    </div>
    <img id="easterEggGif" src="easter-egg.gif" alt="Easter Egg" />
    <audio id="bgMusicInitial" src="sounds/back1.mp3" autoplay loop></audio>
    <audio id="bgMusicMain" src="sounds/breaker.mp3" loop></audio>
    <audio id="bgEnterSound" src="sounds/enter.mp3"></audio>
    <audio id="getoutSound" src="sounds/getout.mp3"></audio>
    <audio id="tvtimeSound" src="sounds/tvtime.mp3"></audio>
    <audio id="boomSound" src="sounds/boom.mp3"></audio>
    <script>
      const loginScreen = document.getElementById('loginScreen');
      const mainContent = document.getElementById('mainContent');
      const loginInput = document.getElementById('loginInput');
      const codigoInput = document.getElementById('codigo');
      const bgVideo1 = document.getElementById('bgVideo1');
      const bgVideo2 = document.getElementById('bgVideo2');
      const animacionNumeros = document.getElementById('animacionNumeros');
      const easterEggGif = document.getElementById('easterEggGif');
      const imagenLunark = document.getElementById('imagenLunark');
      const imagenFem = document.getElementById('imagenFem');
      const bgMusicInitial = document.getElementById('bgMusicInitial');
      const bgMusicMain = document.getElementById('bgMusicMain');
      const bgEnterSound = document.getElementById('bgEnterSound');
      const getoutSound = document.getElementById('getoutSound');
      const tvtimeSound = document.getElementById('tvtimeSound');
      const boomSound = document.getElementById('boomSound');

      const redirecciones = {
        "tenna": "https://deltarune.com",
        "sir": "https://tusitio.com/sir.png",
        "lalalalalala": "https://www.mediafire.com/file/oo8zq1z9q4g0qvm/historianeock_1_(1).wav/file",
        "exo": "https://tusitio.com/exo.png",
        "nameless": "https://deltarune.com",
        "2025": "https://tusitio.com/2025.png",
        "estonoesuncodigo": "https://tusitio.com/estonoesuncodigo.png",
        "weird": "https://deltarune.com",
        "chafasafio6en2025": "https://tusitio.com/chafa.png",
        "exomech": "https://deltarune.com",
        "ralsei": "https://deltarune.com",
        "quiz": "https://deltarune.com",
        "neo": "https://deltarune.com",
        "tvtime!!!!": "https://tusitio.com/tvtime.png",
        "hardmode": "https://tusitio.com/hardmode.png",
        "plantera": "https://tusitio.com/plantera.png",
        "revill": "https://tusitio.com/revill.png"
      };

      function cambiarFondo(videoToShow, videoToHide) {
        videoToHide.classList.remove('bgAnimado');
        videoToHide.classList.add('desaparecer');
        videoToShow.classList.add('mostrar');
        videoToShow.classList.remove('desaparecer');
        void videoToShow.offsetWidth;
        videoToShow.classList.add('bgAnimado');
        setTimeout(() => {
          videoToHide.classList.remove('mostrar', 'desaparecer');
          videoToHide.style.opacity = 0;
        }, 1500);
      }

      // Login
      loginInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const clave = loginInput.value.trim();
          if (clave === 'blazium') {
            loginScreen.style.transition = 'opacity var(--transition-speed) ease-out, transform var(--transition-speed) ease-out';
            loginScreen.style.opacity = 0;
            loginScreen.style.transform = 'translateY(-40px)';
            let vol = bgMusicInitial.volume;
            const fadeOutInterval = setInterval(() => {
              if (vol > 0.01) {
                vol -= 0.05;
                bgMusicInitial.volume = vol;
              } else {
                clearInterval(fadeOutInterval);
                bgMusicInitial.pause();
                bgMusicInitial.currentTime = 0;
                bgMusicInitial.volume = vol;
              }
            }, 50);

            bgEnterSound.currentTime = 0;
            bgEnterSound.play();
            bgMusicMain.volume = 0;
            bgMusicMain.play();
            let volMain = 0;
            const fadeInInterval = setInterval(() => {
              if (volMain < 1) {
                volMain += 0.05;
                bgMusicMain.volume = volMain;
              } else {
                clearInterval(fadeInInterval);
              }
            }, 50);

            cambiarFondo(bgVideo1, bgVideo2);
            setTimeout(() => {
              loginScreen.style.display = 'none';
            }, 1000);
            setTimeout(() => {
              mainContent.style.display = 'flex';
              requestAnimationFrame(() => {
                mainContent.style.opacity = 1;
                mainContent.style.transform = 'translateY(0)';
                codigoInput.focus();
              });
            }, 3000);
          } else {
            alert('Clave incorrecta');
            loginInput.value = '';
          }
        }
      });
    </script>
  </body>
</html>
