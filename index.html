<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>BLAZIUM CODE BREAKER</title>

  <style>
    @font-face {
      font-family: 'DeltaruneFont';
      src: url('deltarune.ttf') format('truetype');
    }

    /* Reset y body centrado */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: black;
      font-family: 'DeltaruneFont', monospace;
      color: white;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
      z-index: 0;
    }

    /* Video de fondo */
    #bgVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
    }

    /* Contenedor centrado */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      text-align: center;
      padding: 20px;
      z-index: 1;
      width: 320px; /* ancho fijo para que no se estire demasiado */
    }

    h1 {
      font-size: 2.5em;
      margin: 0;
      opacity: 0;
      transform: translateY(40px);
      animation: subir 1s ease-out forwards;
      user-select: none;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      font-size: 1.3em;
      background-color: rgba(0, 0, 0, 0.6);
      color: white;
      border: 2px solid white;
      border-radius: 5px;
      outline: none;
      opacity: 0;
      animation: aparecer 1s ease-out forwards;
      animation-delay: 1s;
      font-family: 'DeltaruneFont', monospace;
    }

    input::placeholder {
      color: #ccc;
    }

    @keyframes subir {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes aparecer {
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <video autoplay muted loop id="bgVideo" playsinline>
    <source src="vid.mp4" type="video/mp4" />
    Tu navegador no soporta video.
  </video>

  <div class="container">
    <h1>BLAZIUM CODE BREAKER</h1>
    <input type="text" id="codigo" placeholder="INGRESA EL CODIGO" autocomplete="off" />
  </div>

  <script>
    document.getElementById('codigo').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const valor = this.value.trim().toLowerCase();

        if (valor === "hola") {
          window.location.href = "https://deltarune.com"; // Cambia por tu enlace real
        } else {
          alert("Ese destino no existe...");
        }
      }
    });
  </script>

</body>
</html>
