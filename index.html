<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>BLAZIUM CODE BREAKER</title>

  <style>
    /* Cargar la fuente local */
    @font-face {
      font-family: 'DeltaruneFont';
      src: url('deltarune.ttf') format('truetype');
    }

    body {
      background-color: black;
      color: white;
      font-family: 'DeltaruneFont', monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    h1 {
      font-size: 2em;
      opacity: 0;
      transform: translateY(40px);
      animation: subir 1s ease-out forwards;
    }

    input {
      margin-top: 30px;
      padding: 10px;
      font-size: 1.2em;
      background-color: black;
      color: white;
      border: 2px solid white;
      outline: none;
      opacity: 0;
      animation: aparecer 1s ease-out forwards;
      animation-delay: 1s;
      font-family: 'DeltaruneFont', monospace;
    }

    @keyframes subir {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes aparecer {
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <h1>BLAZIUM CODE BREAKER</h1>
  <input type="text" id="codigo" placeholder="INGRESA EL CODIGO">

  <script>
    document.getElementById('codigo').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const valor = this.value.trim().toLowerCase();

        // Agrega aquí los códigos válidos
        if (valor === "hola") {
          window.location.href = "https://deltarune.com"; // Cambia por tu enlace real
        } else {
          alert("Ese destino no existe...");
        }
      }
    });
  </script>

</body>
</html>
